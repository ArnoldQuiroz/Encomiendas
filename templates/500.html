{% extends "base.html" %}
{% block title %}Error del Servidor | 500{% endblock %}
{% block content %}
<div class="text-center py-5">
    <div class="mb-4">
        <i class="fas fa-exclamation-triangle fa-5x text-danger" style="opacity: 0.8;"></i>
    </div>
    <h1 class="display-1 fw-bold text-danger">500</h1>
    <h2 class="h3">Error interno del servidor</h2>
    <p class="lead text-muted mb-4">Vaya, algo salió mal de nuestro lado. Intenta recargar la página en unos minutos.</p>
    <a href="/" class="btn btn-outline-danger px-4 py-2"><i class="fas fa-redo me-2"></i>Intentar de nuevo</a>
</div>
{% endblock %}
