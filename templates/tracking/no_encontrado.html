{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Código no encontrado | Rastreo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        html, body {
            margin: 0; padding: 0; min-height: 100vh;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 40%, #4f46e5 100%);
            font-family: 'Inter', -apple-system, sans-serif;
            display: flex; align-items: center; justify-content: center;
            color: #fff;
        }
        body::before {
            content: ''; position: fixed; top: -100px; right: -50px;
            width: 400px; height: 400px; border-radius: 50%;
            background: radial-gradient(circle, rgba(239,68,68,.2), transparent 70%);
            pointer-events: none;
        }
        .wrap { max-width: 520px; width: 100%; padding: 2rem; text-align: center; position: relative; z-index: 1; }
        .ico {
            width: 130px; height: 130px; margin: 0 auto 2rem;
            border-radius: 32px;
            background: rgba(239,68,68,.18);
            border: 2px solid rgba(248,113,113,.4);
            display: flex; align-items: center; justify-content: center;
            font-size: 3.5rem; color: #fca5a5;
            box-shadow: 0 20px 60px rgba(0,0,0,.4);
            backdrop-filter: blur(12px);
        }
        h1 {
            font-size: 1.6rem; font-weight: 800; margin: 0 0 .75rem;
            background: linear-gradient(135deg, #fff, #fca5a5);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .code-shown {
            font-family: 'JetBrains Mono', monospace;
            background: rgba(255,255,255,.12);
            border: 1px solid rgba(255,255,255,.2);
            display: inline-block;
            padding: .35rem .85rem; border-radius: 10px;
            font-weight: 700; font-size: .9rem; margin: .75rem 0 1.5rem;
        }
        p { font-size: .95rem; opacity: .8; line-height: 1.5; margin: 0 0 2rem; }
        .actions { display: flex; gap: .65rem; justify-content: center; flex-wrap: wrap; }
        .btn-x {
            display: inline-flex; align-items: center; gap: .5rem;
            padding: .75rem 1.4rem; border-radius: 11px;
            font-weight: 700; font-size: .88rem;
            text-decoration: none; transition: all .2s;
            border: 1.5px solid transparent;
        }
        .btn-x.solid { background: #fff; color: #4f46e5; }
        .btn-x.solid:hover { background: #f0f0ff; transform: translateY(-2px); box-shadow: 0 8px 20px rgba(0,0,0,.25); }
        .btn-x.outline { background: rgba(255,255,255,.1); color: #fff; border-color: rgba(255,255,255,.3); }
        .btn-x.outline:hover { background: rgba(255,255,255,.2); color: #fff; }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="ico"><i class="fas fa-search"></i></div>
        <h1>Código no encontrado</h1>
        {% if codigo %}<div class="code-shown">{{ codigo }}</div>{% endif %}
        <p>
            No encontramos ningún paquete con este código. Verifica que esté escrito correctamente,
            sin espacios extras ni caracteres faltantes.
        </p>
        <div class="actions">
            <a href="{% url 'tracking_landing' %}" class="btn-x solid">
                <i class="fas fa-search"></i> Buscar de nuevo
            </a>
            <a href="javascript:history.back()" class="btn-x outline">
                <i class="fas fa-arrow-left"></i> Volver
            </a>
        </div>
    </div>
</body>
</html>
