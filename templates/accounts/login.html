{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión | Encomiendas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="{% static 'css/styles.css' %}?v=2">
    <style>
        html, body {
            margin: 0; padding: 0;
            min-height: 100vh;
            background: linear-gradient(135deg, #4f46e5 0%, #3b82f6 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', -apple-system, sans-serif;
        }
        .lc {
            background: #fff;
            border-radius: 24px;
            padding: 2.5rem;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.25);
        }
        .lc-logo {
            width: 64px; height: 64px;
            border-radius: 18px;
            background: linear-gradient(135deg, #4f46e5, #3b82f6);
            display: flex; align-items: center; justify-content: center;
            font-size: 1.7rem; color: #fff;
            margin: 0 auto 1.2rem;
            box-shadow: 0 8px 24px rgba(79,70,229,0.45);
        }
        .lc h4  { font-size: 1.25rem; font-weight: 800; color: #0f172a; text-align: center; margin: 0 0 0.25rem; }
        .lc .sub { color: #94a3b8; font-size: 0.82rem; text-align: center; margin: 0 0 1.75rem; }
        .lc label { font-weight: 600; font-size: 0.8rem; color: #475569; margin-bottom: 0.4rem; display: block; }
        .lc .input-group { margin-bottom: 1.1rem; }
        .lc .input-group-text {
            background: #f8fafc;
            border: 1.5px solid #e2e8f0;
            color: #94a3b8;
            border-right: none;
            border-radius: 10px 0 0 10px;
            padding: 0 0.85rem;
        }
        .lc .form-control {
            border: 1.5px solid #e2e8f0;
            border-left: none;
            border-radius: 0 10px 10px 0;
            padding: 0.6rem 0.9rem;
            font-size: 0.875rem;
            transition: all 0.2s;
        }
        .lc .form-control:focus {
            border-color: #4f46e5;
            box-shadow: 0 0 0 3px rgba(79,70,229,0.12);
            outline: none;
        }
        .lc .form-control:focus ~ .input-group-text,
        .lc .input-group:focus-within .input-group-text {
            border-color: #4f46e5;
        }
        .lc .btn-eye {
            border: 1.5px solid #e2e8f0; border-left: none;
            background: #f8fafc; border-radius: 0 10px 10px 0;
            color: #94a3b8; cursor: pointer;
            padding: 0 0.85rem;
            transition: color 0.2s;
        }
        .lc .btn-eye:hover { color: #4f46e5; }
        .lc .btn-login {
            width: 100%;
            background: linear-gradient(135deg, #4f46e5, #3b82f6);
            border: none; border-radius: 12px;
            color: #fff; font-weight: 700;
            padding: 0.75rem;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 14px rgba(79,70,229,0.35);
            margin-top: 0.5rem;
        }
        .lc .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(79,70,229,0.45);
        }
        .lc .btn-login:active { transform: translateY(0); }
        .lc .footer-txt { color: #cbd5e1; font-size: 0.72rem; text-align: center; margin-top: 1.5rem; }
        .alert-login {
            background: #fef2f2; border: 1px solid #fecaca;
            color: #b91c1c; border-radius: 10px;
            padding: 0.6rem 0.9rem; font-size: 0.82rem;
            margin-bottom: 1.25rem;
            display: flex; align-items: center; gap: 0.5rem;
        }
    </style>
</head>
<body>
    <div class="lc">
        <div class="lc-logo"><i class="fas fa-shipping-fast"></i></div>
        <h4>Sistema de Encomiendas</h4>
        <p class="sub">Ingresa tus credenciales para continuar</p>

        {% if form.errors %}
        <div class="alert-login">
            <i class="fas fa-exclamation-circle"></i>
            Usuario o contraseña incorrectos. Intenta de nuevo.
        </div>
        {% endif %}

        <form method="post" action="{% url 'login' %}">
            {% csrf_token %}

            <div>
                <label>Usuario</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-user" style="font-size:0.8rem;"></i></span>
                    <input type="text" name="username" class="form-control"
                           placeholder="Tu nombre de usuario" required autofocus>
                </div>
            </div>

            <div>
                <label>Contraseña</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-lock" style="font-size:0.8rem;"></i></span>
                    <input type="password" name="password" id="passInput"
                           class="form-control" placeholder="Tu contraseña" required>
                    <button type="button" class="btn-eye" onclick="togglePass()">
                        <i class="fas fa-eye" id="eyeIcon" style="font-size:0.8rem;"></i>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn-login">
                <i class="fas fa-sign-in-alt me-2"></i>Iniciar Sesión
            </button>

            <input type="hidden" name="next" value="{{ next }}">
        </form>

        <p class="footer-txt">Sistema de Gestión de Encomiendas &copy; 2026</p>
    </div>

    <script>
    function togglePass() {
        const input = document.getElementById('passInput');
        const icon  = document.getElementById('eyeIcon');
        if (input.type === 'password') {
            input.type = 'text';
            icon.classList.replace('fa-eye', 'fa-eye-slash');
        } else {
            input.type = 'password';
            icon.classList.replace('fa-eye-slash', 'fa-eye');
        }
    }
    </script>
</body>
</html>
