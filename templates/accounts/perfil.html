{% extends 'base.html' %}
{% block title %}Mi Perfil{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow">
            <div class="card-header"><h5 class="mb-0"><i class="fas fa-user me-2"></i>Mi Perfil</h5></div>
            <div class="card-body">
                <p><strong>Usuario:</strong> {{ user.username }}</p>
                <p><strong>Email:</strong> {{ user.email }}</p>
                <p><strong>Nombre:</strong> {{ user.get_full_name|default:'—' }}</p>
                <a href="{% url 'logout' %}" class="btn btn-outline-danger"><i class="fas fa-sign-out-alt me-1"></i>Cerrar sesión</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
